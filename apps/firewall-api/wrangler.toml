name = "firewall-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
account_id = "02fab3c83f2f24ed8457a7575fe03150"

routes = [
  { pattern = "aifirewallapi.ashishlabs.com", custom_domain = true }
]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "POLICY_CACHE"
id = "7fbf19505d334e2ca23e40a36b1f6884"

[[kv_namespaces]]
binding = "VERDICT_CACHE"
id = "08bdcede02144671a84b46fb7bd1881f"

[[vectorize]]
binding = "FIREWALL_VECTORIZE"
index_name = "ai-firewall-attacks"

[vars]
ENVIRONMENT = "production"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "KEY_REVOCATION"
class_name = "KeyRevocation"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Remove legacy Durable Object classes dropped in the SecurityProfile refactor
[[migrations]]
tag = "v1"
deleted_classes = ["KeyRevocation", "RateLimiter"]
