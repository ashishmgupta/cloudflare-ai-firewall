name = "policy-manager"
main = "src/index.ts"
compatibility_date = "2024-12-18"
account_id = "02fab3c83f2f24ed8457a7575fe03150"

[ai]
binding = "AI"

# Shared KV namespaces with firewall-api (same IDs)
[[kv_namespaces]]
binding = "POLICY_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "API_KEYS"
id = "REPLACE_WITH_API_KEYS_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_API_KEYS_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "TENANTS"
id = "REPLACE_WITH_TENANTS_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_TENANTS_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "POLICY_STORE"
bucket_name = "ai-firewall-policies"

[[r2_buckets]]
binding = "AUDIT_LOG"
bucket_name = "ai-firewall-audit"

[[vectorize]]
binding = "FIREWALL_VECTORIZE"
index_name = "ai-firewall-attacks"

[vars]
ENVIRONMENT = "production"

# Store admin tokens as secrets: wrangler secret put ADMIN_TOKEN
