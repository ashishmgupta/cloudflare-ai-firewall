name = "policy-manager"
main = "src/index.ts"
compatibility_date = "2024-12-18"
account_id = "02fab3c83f2f24ed8457a7575fe03150"

routes = [
  { pattern = "aifirewallmanager.ashishlabs.com", custom_domain = true }
]

[ai]
binding = "AI"

# Shared with firewall-api (same KV namespace ID)
[[kv_namespaces]]
binding = "POLICY_CACHE"
id = "7fbf19505d334e2ca23e40a36b1f6884"

[[r2_buckets]]
binding = "POLICY_STORE"
bucket_name = "ai-firewall-policies"

[[r2_buckets]]
binding = "AUDIT_LOG"
bucket_name = "ai-firewall-audit"

[[d1_databases]]
binding        = "DB"
database_name  = "firewall-events"
database_id    = "91379b5b-c82f-4c14-8351-c0d57eca83aa"

[[vectorize]]
binding = "FIREWALL_VECTORIZE"
index_name = "ai-firewall-attacks"

[vars]
ENVIRONMENT = "production"

[observability]
enabled = true

# Store admin token as a secret: wrangler secret put ADMIN_TOKEN
