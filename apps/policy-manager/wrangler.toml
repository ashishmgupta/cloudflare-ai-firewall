name = "policy-manager"
main = "src/index.ts"
compatibility_date = "2024-12-18"
account_id = "02fab3c83f2f24ed8457a7575fe03150"

[ai]
binding = "AI"

# Shared with firewall-api (same KV namespace ID)
[[kv_namespaces]]
binding = "POLICY_CACHE"
id = "7fbf19505d334e2ca23e40a36b1f6884"

[[r2_buckets]]
binding = "POLICY_STORE"
bucket_name = "ai-firewall-policies"

[[r2_buckets]]
binding = "AUDIT_LOG"
bucket_name = "ai-firewall-audit"

[vars]
ENVIRONMENT = "production"

# Store admin token as a secret: wrangler secret put ADMIN_TOKEN
